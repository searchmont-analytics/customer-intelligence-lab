name: Browser quality checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'tests/**', '.github/workflows/browser-qa.yml']
  pull_request:
    paths: ['index.html', 'tests/**', '.github/workflows/browser-qa.yml']
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulated-interface regression
        run: node tests/smoke.mjs
      - name: Install browser test tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Real browser layout and interaction tests
        run: node tests/browser.mjs
      - name: Browser review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: tests/output/*.png
          if-no-files-found: ignore
